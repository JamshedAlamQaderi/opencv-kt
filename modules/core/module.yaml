description: "OpenCV core module (Mat, Scalar, CvType, native runtime bootstrap)."

product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - linuxX64
    - linuxArm64
    - mingwX64
    - androidNativeArm64
    - androidNativeArm32
    - androidNativeX64
    - androidNativeX86

aliases:
  # JVM desktop + Android share the JNI bridge (same C ABI, library loaded differently).
  - jvmAndAndroid: [jvm, android]

apply:
  - //templates/opencv-lib.module-template.yaml
  - //templates/publish.module-template.yaml

settings:
  publishing:
    artifactId: opencvkt-core
