description: "Umbrella artifact that pulls in every opencv-kt module (core + all OpenCV modules)."

product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - linuxX64
    - linuxArm64
    - mingwX64
    - androidNativeArm64
    - androidNativeArm32
    - androidNativeX64
    - androidNativeX86

apply:
  - //templates/opencv-lib.module-template.yaml
  - //templates/publish.module-template.yaml

dependencies:
  - //modules/core: exported
  - //modules/flann: exported
  - //modules/geometry: exported
  - //modules/imgproc: exported
  - //modules/imgcodecs: exported
  - //modules/videoio: exported
  - //modules/highgui: exported
  - //modules/features: exported
  - //modules/stereo: exported
  - //modules/objdetect: exported
  - //modules/calib: exported
  - //modules/dnn: exported
  - //modules/photo: exported
  - //modules/video: exported
  - //modules/ptcloud: exported
  - //modules/stitching: exported

settings:
  publishing:
    artifactId: opencvkt
