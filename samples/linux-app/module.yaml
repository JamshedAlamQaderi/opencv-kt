description: "Sample Kotlin/Native Linux executable; OpenCV is linked statically from core's klib."

product:
  type: linux/app
  platforms: [ linuxX64 ]

dependencies:
  - //modules/opencv

settings:
  kotlin:
    version: 2.4.21
  native:
    entryPoint: com.jamshedalamqaderi.kmp.opencvkt.samples.main
